name: Build Mira Studio Serverless image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: mira-studio-serverless-image
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push private worker image
        uses: docker/build-push-action@v6
        with:
          context: ./Serverless
          file: ./Serverless/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/mira-studio-worker:latest
            ghcr.io/${{ github.repository_owner }}/mira-studio-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
